  .preview-main{max-width:1280px;margin:30px auto;padding:0 22px 28px}

  .preview-mobile-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .preview-mobile-toolbar h2,.preview-mobile-toolbar label{margin:0}
  .preview-mobile-toolbar select{width:auto;min-height:40px;font-size:12px}
  .preview-mobile iframe{width:min(100%,390px);max-width:100%;margin-inline:auto}
  .preview-qr{max-width:420px;margin:34px auto 0}.preview-qr>h2{font-size:15px;margin-bottom:13px}
  @media(max-width:1120px){.preview-comparison{grid-template-columns:1fr}.preview-mobile{max-width:390px;width:100%;margin-inline:auto}}
