<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نمونهٔ گزینه‌های آزمون مفید</title><link rel="stylesheet" href="/Academy-Exam/exam-skin.css?v=20261028-shiny-1"><style>:root{--teal-900:#0a4d47;--teal-800:#3FC1BE;--teal-700:#0f7c72;--teal-600:#12968a;--teal-500:#19a894;--ink:#16302e;--ink-2:#496b67;--ink-3:#7b9995;--font:"Pinar VF",Tahoma,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:linear-gradient(145deg,#ecf8ef,#dcefe3);font-family:"Pinar VF",Pinar,Tahoma,sans-serif;color:#164d3b}main{width:min(760px,calc(100% - 36px));padding:36px;border:1px solid #fff;border-radius:26px;background:rgba(255,255,255,.78);box-shadow:0 20px 65px #164d3b15}h1{font-size:25px;margin:0 0 8px}p{font-size:13px;color:#668573;margin:0 0 25px}.opts{display:grid;gap:14px;position:relative}.opt{font:inherit;font-size:15px;line-height:1.9;display:flex;align-items:center;gap:15px;width:100%;text-align:right;padding:16px 20px;cursor:pointer;background:#f8fdf9;border:1px solid #cbe1d1}.opt .key{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:#eef8f0;color:#11715a;border:1px solid #c9dfd0}.opt[aria-pressed="true"]{background:#dff1e5;border-color:#12967c}.btns{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-top:28px}.b{font:inherit;font-size:14px;line-height:1.8;padding:9px 23px;color:#195f43;border:1px solid #b8d5c3;background:#f2faf5;cursor:pointer}.b.p{background:linear-gradient(120deg,#12694e,#15957c);color:white;border-color:#12694e}.b:disabled{opacity:.4;cursor:default}#sample-counter{font-size:13px;color:#6a8c75}@media(max-width:600px){main{padding:25px 20px}.opt{padding:14px}.opts{gap:12px}}</style></head><body><main id="view"><h1>نمونهٔ گزینه‌های آزمون</h1><p>این صفحه فقط برای دیدن ظاهر گزینه‌هاست.</p><div class="opts" role="group" aria-label="گزینه‌های نمونه"><button type="button" class="opt" aria-pressed="false"><span class="key">۱</span><span>گزینهٔ اول</span></button><button type="button" class="opt" aria-pressed="true"><span class="key">۲</span><span>گزینهٔ انتخاب‌شده</span></button><button type="button" class="opt" aria-pressed="false"><span class="key">۳</span><span>گزینهٔ سوم</span></button><button type="button" class="opt" aria-pressed="false"><span class="key">۴</span><span>گزینهٔ چهارم</span></button></div><div class="btns"><button type="button" class="b" id="prev" disabled>قبلی</button><span id="sample-counter" aria-live="polite">۱ از ۲</span><button type="button" class="b p" id="next">بعدی ←</button></div></main><script>const options=[...document.querySelectorAll('.opt')];options.forEach(button=>button.onclick=()=>options.forEach(option=>option.setAttribute('aria-pressed',String(option===button))));let page=1;function update(){document.getElementById('sample-counter').textContent=page===1?'۱ از ۲':'۲ از ۲';document.getElementById('prev').disabled=page===1;document.getElementById('next').disabled=page===2;}document.getElementById('prev').onclick=()=>{page=1;update()};document.getElementById('next').onclick=()=>{page=2;update()};</script></body></html>
