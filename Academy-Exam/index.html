<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Academy Exam — MOFID Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--teal:#4fd4c6;--teal2:#149c93;--violet:#7550c8;--coral:#e0564c;--paper:#eef8f6;--ink:#02201f}*{box-sizing:border-box}html,body{height:100%}body{margin:0;font-family:Vazirmatn,Tahoma,sans-serif;color:var(--paper);background:var(--ink);overflow:hidden}.bg{position:fixed;inset:0;background:radial-gradient(120% 90% at 85% 8%,#0d5f5c 0%,transparent 55%),radial-gradient(110% 80% at 8% 92%,#3d2570 0%,transparent 58%),linear-gradient(200deg,#03201f,#06100f)}.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.45}.a{width:45vmax;height:45vmax;background:#0f8d84;top:-16vmax;right:-12vmax}.b{width:38vmax;height:38vmax;background:#6a3fbe;bottom:-14vmax;left:-10vmax}.shell{position:relative;z-index:1;min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}.card{width:min(760px,100%);padding:38px;border:1px solid rgba(255,255,255,.2);border-radius:26px;background:linear-gradient(150deg,rgba(255,255,255,.09),rgba(255,255,255,.055));backdrop-filter:blur(24px);box-shadow:0 28px 70px rgba(0,0,0,.45)}.brand{font-weight:900;font-size:1.1rem;color:var(--teal);margin-bottom:22px}.mark{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--teal2),var(--violet));box-shadow:0 14px 35px rgba(0,0,0,.3);margin-bottom:22px}.mark:before{content:"";width:42px;height:52px;background:var(--paper);clip-path:polygon(50% 0,100% 100%,0 100%)}h1{font-size:clamp(1.8rem,4vw,2.6rem);margin:0 0 14px}.lead{line-height:2;color:rgba(238,248,246,.78);margin:0 0 22px}.err{padding:14px 16px;border-radius:14px;background:rgba(224,86,76,.14);border:1px solid rgba(224,86,76,.45);color:#ffc9c3;line-height:1.9}.chip{display:inline-block;margin-top:16px;padding:7px 14px;border-radius:99px;border:1px solid rgba(79,212,198,.5);color:var(--teal);font-size:.85rem}@media(max-width:640px){body{overflow:auto}.card{padding:24px}}
</style>
</head>
<body>
<div class="bg"><div class="orb a"></div><div class="orb b"></div></div>
<div class="shell"><main class="card">
<div class="mark"></div>
<div class="brand">MOFID Academy</div>
<h1>Academy Exam</h1>
<p class="lead">سامانه آزمون آکادمی مفید آماده انتشار است.</p>
<div class="err">برای شروع واقعی آزمون، آدرس دریافت سؤال‌ها و وبهوک ارسال پاسخ‌های n8n باید به این صفحه متصل شوند.</div>
<span class="chip">Academy Exam</span>
</main></div>
</body>
</html>
