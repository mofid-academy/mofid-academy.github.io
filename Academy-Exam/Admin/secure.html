<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="../public-network.js?v=l20261020"></script>
<title>مدیریت آزمون، آرشیو و نتایج | آکادمی مفید</title>
<link rel="preload" href="../assets/Pinar-VF.woff" as="font" type="font/woff" crossorigin>
<link rel="stylesheet" href="admin-brand.css?v=p20261019">
<style>html,body{height:100%;margin:0;background:#f6f9f8;font-family:Tahoma,sans-serif}.loading{display:grid;place-items:center;height:100%;color:#315b55}</style>
</head>
<body><div class="loading">در حال بارگذاری پنل مدیریت…</div>
<script>
(async()=>{
async function readLiveTiming(options={}){
 if(!window.__ACADEMY_PUBLIC_NETWORK__)throw Error('مسیر عمومی اتصال آماده نیست؛ صفحه را دوباره بارگذاری کنید.');
 return window.__ACADEMY_PUBLIC_NETWORK__.readTiming(options);
}

  const [baseRes,timeRes]=await Promise.all([
    fetch('base.html?v='+Date.now(),{cache:'no-store'}),
    readLiveTiming({localOnly:true})
  ]);
  if(!baseRes.ok)throw Error('base '+baseRes.status);
  let html=await baseRes.text();
  html=html
    .replace("connect-src https://api.github.com", "connect-src https://raw.githubusercontent.com https://api.github.com")
    .replace("script-src 'unsafe-inline';","script-src 'unsafe-inline' 'self';")
    .replace('PATH="Academy-Exam/index.html"','PATH="Academy-Exam/base.html"')
    .replace('LIVE="https://mofid-academy.github.io/Academy-Exam/index.html"','LIVE="https://mofid-academy.github.io/Academy-Exam/base.html"');


  // Secure mode is fail-closed: no native browser request to the GitHub API.
  html=html.replace(/connect-src[^;]+;/,directive=>directive.replace('https://api.github.com',''));
  // Keep admin branding separate from the participant form and generated bundle.
  html=html
    .replace(/<link\b[^>]*href="https:\/\/fonts\.googleapis\.com\/[^"]*"[^>]*>/g,'')
    .replace(/font-src[^;]+;/,"font-src 'self';")
    .replace(/img-src[^;]+;/,"img-src 'self' data: blob:;")
    .replace(/style-src[^;]+;/,"style-src 'self' 'unsafe-inline';")
    .replace('<span class="mark">A</span>','<img class="academy-logo" src="../assets/mofid-academy-logo.webp" alt="لوگوی آکادمی مفید" width="64" height="64" decoding="async">')
    .replace('</head>','<link rel="preload" href="../assets/Pinar-VF.woff" as="font" type="font/woff" crossorigin><link rel="stylesheet" href="admin-brand.css?v=p20261019"></head>');
  const oldCheck='if(!t.startsWith("github_pat_"))';
  if(!html.includes(oldCheck))throw Error('نسخه پنل برای اتصال امن نیاز به به‌روزرسانی دارد.');
  html=html.replace(oldCheck,'if(!/^[\\x21-\\x7e]{16,128}$/.test(t)||/^(github_pat_|ghp_)/.test(t))')
    .replace('یک Fine-grained token با پیشوند github_pat_ وارد کن.','رمز مخصوص ادمین را وارد کنید؛ توکن GitHub فقط در n8n تنظیم می‌شود.')
    .replace(/<dialog id="auth">[\s\S]*?<\/dialog>/,`<dialog id="auth"><button id="authClose" class="dialog-x" aria-label="بستن">×</button><div class="dialog-icon">↗</div><h2>ورود ادمین</h2><p>رمز مدیریت را وارد کنید.</p><a id="tokenLink" hidden></a><label for="token">رمز ادمین</label><input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="رمز ادمین" dir="ltr"><p class="tip">با خروج یا بازخوانی صفحه، رمز از حافظه پاک می‌شود.</p><div id="authMessage" role="status"></div><div class="dialog-actions"><button id="connect" class="primary">ورود</button><button id="logout">خروج</button></div></dialog>`);
  html=html.replace('<iframe id="preview"', '<iframe allow="local-network \'none\'; loopback-network \'none\'; local-network-access \'none\'" id="preview"');
  const bridgeScript='<scr'+'ipt src="admin-bridge.js?v=h20261019b"></scr'+'ipt>';
  html=html.replace('<body>','<body><scr'+'ipt src="../public-network.js?v=l20261020"></scr'+'ipt>'+bridgeScript);

  const oldQuestionRead=`   const r=await fetch(u.href,{headers:{Accept:"application/json"},credentials:"omit",redirect:"error",
    cache:"no-store",referrerPolicy:"no-referrer",signal:AbortSignal.timeout(20000)});
   if(!r.ok)throw Error("دریافت سؤال‌ها ناموفق بود: HTTP "+r.status);
   const text=await r.text();if(text.length>2000000)throw Error("پاسخ سرور بیش از حد بزرگ است.");
   adoptQuestions(AcademyQuestions.fromInput(JSON.parse(text)));
   status("سؤال‌ها وارد شدند. فقط متن و مشخصات عمومی نگه داشته شد؛ پاسخ صحیح و اطلاعات خصوصی وارد نمی‌شود.","success");`;
  if(!html.includes(oldQuestionRead))throw Error('نسخهٔ بخش دریافت سؤال‌ها هماهنگ نیست؛ پنل را دوباره باز کنید.');
  html=html.replace(oldQuestionRead,`   if(typeof window.__ACADEMY_REFRESH_QUESTIONS__!=="function")throw Error("بخش دریافت سؤال آماده نیست؛ صفحه را دوباره باز کنید.");
   status("در حال دریافت سؤال‌های آزمون از n8n؛ لطفاً صبر کنید…");
   const bank=await window.__ACADEMY_REFRESH_QUESTIONS__({url:u.href});
   status(bank.questions.length+" سؤال برای آزمون «"+bank.examTitle+"» دریافت شد. هنوز روی سایت منتشر نشده است.","success");`);
  html=html.replace('(e.message||e)+" — در خطای CORS یا اتصال، از ورود فایل JSON استفاده کن."','String(e.message||e)');
  const modelLine='let token="",login="",model=null,loadedSHA="",publishedSource="",active="questions",undoStack=[],timer=0,publishing=false,checking=0;';
  if(html.includes(modelLine)){
    html=html.replace(modelLine,modelLine+'\nwindow.__ACADEMY_GET_QUESTION_BANK__=function(){return model&&model.questionBank?model.questionBank:null;};\nwindow.__ACADEMY_GET_ADMIN_TOKEN__=function(){return token||"";};\n'+"window.__ACADEMY_ADMIN__={\n  bank:()=>model?JSON.parse(JSON.stringify(model.questionBank)):null,\n  adopt:raw=>{const bank=AcademyQuestions.fromInput(raw);const issues=AcademyQuestions.errors(bank);if(issues.length)throw Error(issues[0]);adoptQuestions(bank);preview();return JSON.parse(JSON.stringify(bank));},\n  sha:()=>loadedSHA,\n  token:()=>token||'',\n  status:(message,type)=>status(message,type),\n  busy:value=>{publishing=!!value;state();},\n  session:(key,label='مدیر')=>{token=key;login=key?label:'';state();},\n  sourceForBank:bank=>{\n    if(!model)throw Error('ابتدا نسخهٔ سایت را دریافت کنید.');\n    const prior=model.questionBank;\n    try{\n      model.questionBank=JSON.parse(JSON.stringify({...bank,mode:'managed',submitApproved:true}));\n      const doc=new DOMParser().parseFromString(model.build(),'text/html');\n      doc.getElementById('academy-publication')?.remove();\n      doc.getElementById('academy-public-entry')?.remove();\n      const entry=doc.createElement('script');entry.id='academy-public-entry';entry.textContent='if(location.pathname.endsWith(\"/base.html\"))location.replace(new URL(\"./\"+location.search,location.href).href);';doc.head.prepend(entry);doc.querySelectorAll('link[href*=\"fonts.googleapis.com\"],link[href*=\"fonts.gstatic.com\"]').forEach(n=>n.remove());\n      const source='\u003c!DOCTYPE html>\\n'+doc.documentElement.outerHTML+'\\n';model.validate(source);return source;\n    }finally{model.questionBank=prior;}\n  },\n  load:(source,bank)=>{setSource(source.split(\"https://miladmirsheriseyed.app.n8n.cloud\").join(\"https://miladmirsheriam.app.n8n.cloud\").split(\"https://miladmirsheriii.app.n8n.cloud\").join(\"https://miladmirsheriam.app.n8n.cloud\").split(\"https://miladmmirsheri.app.n8n.cloud\").join(\"https://miladmirsheriam.app.n8n.cloud\"));model.questionBank=JSON.parse(JSON.stringify(bank));selectedQuestionId=bank.questions[0]?.id||'';changed();render();preview();},\n  questions:bank=>{if(model){model.questionBank=JSON.parse(JSON.stringify(bank));changed();render();preview();}},\n  clearPrivate:()=>{if(model){for(const q of model.questionBank.questions){delete q.correct_answer;delete q.correct_option_index;delete q.sample_answer;}render();}},\n  confirm:()=>{if(!token)throw Error('ابتدا به ادمین متصل شوید.');if(!loadedSHA)throw Error('ابتدا نسخهٔ سایت را دریافت کنید.');if(!model?.questionBank.questions.length)throw Error('بانک سؤال خالی است.');$('confirmPublish').showModal();},\n  read:()=>readFile(),\n  write:async(source,sha,message)=>{\n    model.validate(source);\n    return (await api(ENDPOINT,{method:'PUT',body:JSON.stringify({message,content:encode64(source),sha,branch:BRANCH})})).json();\n  },\n  published:(source,sha,bank)=>{loadedSHA=sha;publishedSource=source;undoStack=[];setSource(source,false);model.questionBank=JSON.parse(JSON.stringify(bank));try{localStorage.removeItem(DRAFT);}catch{}state();},\n  checkLive:source=>checkLive(source)\n};\n");
  }

  const timing=timeRes;
  const closeScript='</scr'+'ipt>';
  const timingState='<scr'+'ipt>window.__ACADEMY_TIMING__='+JSON.stringify(timing).replace(/</g,'\\u003c')+closeScript;
  html=html.replace('optionDrafts=new Map();changed();render();','optionDrafts=new Map();changed();render();window.__ACADEMY_ON_BANK_ADOPTED__?.(JSON.parse(JSON.stringify(s)));');
  html=html.replace('بانک و فرم روی GitHub عمومی هستند. پاسخ صحیح، کلید دسترسی و معیار تصحیح محرمانه را در این پنل یا متن سؤال وارد نکن.','فایل عمومی فرم فقط شامل سؤال‌هاست. کلیدهای انتخاب‌شده هنگام ذخیره در آرشیو خصوصی سرور نگه داشته می‌شوند.');
  const extensions='<scr'+'ipt src="timing-admin.js?v=l20261020">'+closeScript+'<scr'+'ipt src="site-access-admin.js?v=r20261020a">'+closeScript+'<scr'+'ipt src="exam-save-sync.js?v=q20261020">'+closeScript+'<scr'+'ipt src="answer-key-ui.js?v=2">'+closeScript+'<scr'+'ipt src="file-import-ui.js?v=q20261020">'+closeScript+'<scr'+'ipt src="xlsx-export.js?v=d20261019">'+closeScript+'<scr'+'ipt src="archive-admin.js?v=h20261019b">'+closeScript;
  html=html.replace('<body>','<body>'+timingState);
  html=html.replace('</body>',extensions+'</body>');
  document.open();document.write(html);document.close();
})().catch(e=>{document.body.innerHTML='<div class="loading"><div><h2>پنل مدیریت بارگذاری نشد</h2><p>'+String(e.message||e)+'</p></div></div>';});
</script>
</body>
</html>
