<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت فرم و زمان‌بندی | Academy Studio</title></head><body><p style="font-family:Tahoma;text-align:center;margin-top:12vh">در حال بارگذاری پنل مدیریت…</p><script>
(async()=>{const [b,t]=await Promise.all([fetch('base.html?v='+Date.now(),{cache:'no-store'}),fetch('../timing.json?v='+Date.now(),{cache:'no-store'})]);if(!b.ok)throw Error('base '+b.status);let html=await b.text();html=html.replace('PATH="Academy-Exam/index.html"','PATH="Academy-Exam/base.html"').replace('LIVE="https://mofid-academy.github.io/Academy-Exam/index.html"','LIVE="https://mofid-academy.github.io/Academy-Exam/base.html"');let timing={version:1,enabled:true,openAt:'',lastStartAt:'',durationMinutes:15,timeZone:'Asia/Tehran',timeEndpoint:''};if(t.ok){try{timing={...timing,...await t.json()}}catch{}}
const pre=`<script>window.__ACADEMY_CAPTURED_TOKEN__='';{const f=window.fetch.bind(window);window.fetch=async function(input,opt){try{const a=opt?.headers?.Authorization||opt?.headers?.authorization;if(typeof a==='string'&&a.startsWith('Bearer github_pat_'))window.__ACADEMY_CAPTURED_TOKEN__=a.slice(7)}catch{}return f(input,opt)}}<\/script>`;
const css=`<style>.academy-time-card{display:none;padding:22px 20px 30px;overflow:auto;height:100%;background:#fff}.academy-time-card.active{display:block}.academy-time-hero{background:linear-gradient(145deg,#e8f7f1,#f8fcfa);border:1px solid #cbe8de;border-radius:14px;padding:14px;margin-bottom:18px}.academy-time-hero b{display:block;color:#0b6f5d;font-size:13px}.academy-time-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.academy-time-field{margin-bottom:14px}.academy-time-field label{display:block;font-weight:600;font-size:12px;margin-bottom:6px}.academy-time-field small{display:block;color:#728783;font-size:10px;line-height:1.8;margin-top:5px}.academy-time-field input{width:100%}.academy-time-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.academy-time-actions button{flex:1}.academy-time-summary{padding:12px;border:1px solid #dce9e5;background:#fbfdfc;border-radius:12px;font-size:11px;line-height:2;margin-top:12px}.academy-time-summary b{color:#087f75}@media(max-width:640px){.academy-time-grid{grid-template-columns:1fr}}</style>`;
const post=`<script>(()=>{const initial=${JSON.stringify(timing).replace(/</g,'\\u003c')};let c={...initial},dirty=false;const rail=document.querySelector('.rail'),controls=document.querySelector('.controls'),fields=document.getElementById('fields'),studio=document.querySelector('.studio');if(!rail||!fields)return;const btn=document.createElement('button');btn.dataset.tab='timing';btn.innerHTML='<span>05</span>زمان‌بندی و تایمر';const connect=rail.querySelector('[data-tab="connect"]');rail.insertBefore(btn,connect||rail.lastElementChild);rail.querySelectorAll('[data-tab="connect"] span').forEach(x=>x.textContent='06');rail.querySelectorAll('[data-tab="advanced"] span').forEach(x=>x.textContent='07');rail.querySelectorAll('[data-tab="history"] span').forEach(x=>x.textContent='08');
function fa(v){return String(v).replace(/[0-9]/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d])}function draw(){document.getElementById('panelTitle').textContent='زمان‌بندی و تایمر';document.getElementById('panelHelp').textContent='هر نفر مدت کامل خودش را از لحظه شروع دریافت می‌کند؛ سؤال‌ها همچنان از n8n فعلی می‌آیند.';document.getElementById('search').hidden=true;fields.innerHTML='';const root=document.createElement('div');root.innerHTML='<div class="academy-time-hero"><b>زمان شخصی برای هر شرکت‌کننده</b><p>مثلاً اگر مدت ۱۵ دقیقه باشد، فردی که ساعت ۱۰:۰۸ شروع کند تا ۱۰:۲۳ فرصت دارد. Refresh زمان را ریست نمی‌کند.</p></div><div class="switch-row"><div><b>فعال بودن تایمر</b><br><small>در حالت خاموش، آزمون مثل قبل بدون محدودیت زمان است.</small></div><input id="tm-enabled" type="checkbox"></div><div class="academy-time-grid"><div class="academy-time-field"><label>مدت آزمون برای هر نفر (دقیقه)</label><input id="tm-duration" type="number" min="1" max="480"><small>از لحظه زدن «شروع آزمون».</small></div><div class="academy-time-field"><label>زمان باز شدن آزمون — تهران</label><input id="tm-open" type="datetime-local"><small>قبل از این زمان شروع امکان‌پذیر نیست. خالی = همین حالا باز.</small></div><div class="academy-time-field"><label>آخرین زمان مجاز برای شروع — اختیاری</label><input id="tm-last" type="datetime-local"><small>بعد از این زمان شروع جدید بسته می‌شود؛ افراد شروع‌کرده زمان کامل خود را دارند.</small></div><div class="academy-time-field"><label>سرویس زمان سرور — اختیاری</label><input id="tm-endpoint" type="url" dir="ltr" placeholder="https://.../webhook/exam-time"><small>به‌صورت پیش‌فرض زمان سرور GitHub Pages استفاده می‌شود. این فیلد فقط برای سرویس زمان اختصاصی اختیاری است؛ سؤال‌ساز n8n تغییر نمی‌کند.</small></div></div><div id="tm-summary" class="academy-time-summary"></div><div class="academy-time-actions"><button id="tm-reset">پاک کردن ساعت‌های ورود</button><button class="primary" id="tm-save">ذخیره زمان‌بندی روی سایت</button></div><p id="tm-msg" class="tip"></p>';fields.append(root);const en=root.querySelector('#tm-enabled'),du=root.querySelector('#tm-duration'),op=root.querySelector('#tm-open'),la=root.querySelector('#tm-last'),ep=root.querySelector('#tm-endpoint');en.checked=!!c.enabled;du.value=c.durationMinutes||15;op.value=c.openAt||'';la.value=c.lastStartAt||'';ep.value=c.timeEndpoint||'';function sync(){c.enabled=en.checked;c.durationMinutes=Math.max(1,Math.min(480,+du.value||15));c.openAt=op.value;c.lastStartAt=la.value;c.timeEndpoint=ep.value.trim();dirty=true;root.querySelector('#tm-summary').innerHTML='<b>رفتار فعلی:</b><br>'+(c.enabled?'هر نفر '+fa(c.durationMinutes)+' دقیقه کامل از شروع خودش فرصت دارد.':'تایمر غیرفعال است.')+'<br>'+(c.openAt?'باز شدن: '+fa(c.openAt.replace('T',' — '))+' تهران':'شروع آزمون فعلاً باز است.')+'<br>'+(c.lastStartAt?'آخرین شروع مجاز: '+fa(c.lastStartAt.replace('T',' — '))+' تهران':'آخرین زمان شروع محدود نشده است.')+'<br>مرجع زمان: '+(c.timeEndpoint?'سرویس اختصاصی':'زمان سرور GitHub Pages')};[en,du,op,la,ep].forEach(x=>x.oninput=sync);sync();dirty=false;root.querySelector('#tm-reset').onclick=()=>{op.value='';la.value='';sync()};root.querySelector('#tm-save').onclick=async()=>{sync();if(c.openAt&&c.lastStartAt&&c.lastStartAt<c.openAt){root.querySelector('#tm-msg').textContent='آخرین زمان شروع نمی‌تواند قبل از زمان باز شدن باشد.';return}if(c.timeEndpoint){try{const u=new URL(c.timeEndpoint);if(u.protocol!=='https:')throw 0}catch{root.querySelector('#tm-msg').textContent='آدرس سرویس زمان باید HTTPS باشد.';return}}const token=window.__ACADEMY_CAPTURED_TOKEN__;if(!token){root.querySelector('#tm-msg').textContent='ابتدا از دکمه «اتصال ادمین» بالای صفحه به GitHub متصل شو، سپس دوباره ذخیره کن.';return}const msg=root.querySelector('#tm-msg');msg.textContent='در حال ذخیره…';try{const api='https://api.github.com/repos/mofid-academy/mofid-academy.github.io/contents/Academy-Exam/timing.json';const h={Accept:'application/vnd.github+json',Authorization:'Bearer '+token,'Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'};const cur=await fetch(api+'?ref=main',{headers:h,cache:'no-store'});if(!cur.ok)throw Error('GitHub '+cur.status);const j=await cur.json();const raw=new TextEncoder().encode(JSON.stringify({...c,version:1,timeZone:'Asia/Tehran'},null,2)+'\\n');let b='';for(let i=0;i<raw.length;i++)b+=String.fromCharCode(raw[i]);const put=await fetch(api,{method:'PUT',headers:h,body:JSON.stringify({message:'Academy Studio: update exam timing',content:btoa(b),sha:j.sha,branch:'main'})});if(!put.ok)throw Error('GitHub '+put.status);dirty=false;msg.textContent='زمان‌بندی ذخیره شد. فرم اصلی همین تنظیمات را می‌خواند.'}catch(e){msg.textContent='ذخیره ناموفق: '+e.message}}}
btn.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===btn));studio.classList.remove('questions-mode');draw()};})();<\/script>`;
html=html.replace('</head>',css+'</head>');html=html.replace('<body>', '<body>'+pre);html=html.replace('</body>',post+'</body>');document.open();document.write(html);document.close()})().catch(e=>{document.body.innerHTML='<div style="font-family:Tahoma;text-align:center;margin:12vh"><h2>پنل مدیریت بارگذاری نشد</h2><p>'+String(e.message||e)+'</p></div>'});
</script></body></html>
