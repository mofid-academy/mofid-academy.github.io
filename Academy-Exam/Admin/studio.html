<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مدیریت فرم و سؤال‌ها | Academy Studio</title>
<style>html,body{height:100%;margin:0;background:#f6f9f8;font-family:Tahoma,sans-serif}.loading{display:grid;place-items:center;height:100%;color:#315b55}</style>
</head>
<body><div class="loading">در حال بارگذاری پنل مدیریت…</div>
<script>
(async()=>{
  const [baseRes,timeRes]=await Promise.all([
    fetch('base.html?v='+Date.now(),{cache:'no-store'}),
    fetch('../timing.json?v='+Date.now(),{cache:'no-store'})
  ]);
  if(!baseRes.ok)throw Error('base '+baseRes.status);
  let html=await baseRes.text();
  html=html
    .replace("script-src 'unsafe-inline';","script-src 'unsafe-inline' 'self';")
    .replace('PATH="Academy-Exam/index.html"','PATH="Academy-Exam/base.html"')
    .replace('LIVE="https://mofid-academy.github.io/Academy-Exam/index.html"','LIVE="https://mofid-academy.github.io/Academy-Exam/base.html"');
  let timing={version:1,enabled:true,openAt:'',lastStartAt:'',durationMinutes:15,timeZone:'Asia/Tehran',timeEndpoint:''};
  if(timeRes.ok){try{timing={...timing,...await timeRes.json()}}catch{}}
  const closeScript='</scr'+'ipt>';
  const timingState='<scr'+'ipt>window.__ACADEMY_TIMING__='+JSON.stringify(timing)+closeScript;
  const syncCode=`(function(){
'use strict';
const EXAM_SAVE_URL='https://miladmirsheriii.app.n8n.cloud/webhook/exam-save';
window.__ACADEMY_EXAM_SAVE_SYNC_VERSION__='6';
function msg(text,type){
  try{if(typeof status==='function')return status(text,type);}catch(e){}
  const el=document.getElementById('status');if(el){el.textContent=text;el.className='status'+(type?' '+type:'');}
}
function getBank(){try{return (typeof model!=='undefined'&&model&&model.questionBank)?model.questionBank:null;}catch(e){return null;}}
function makePayload(bank){
  const examId=String(bank.originalExamId||bank.examId||bank.exam_id||'').trim();
  if(!examId)throw new Error('شناسه امتحان پیدا نشد. ابتدا «دریافت سؤال‌های فعلی از n8n» را بزن.');
  const questions=(Array.isArray(bank.questions)?bank.questions:[]).map((q,index)=>{
    const stableId=String(q.id||q.question_id||q.qid||(examId+'-Q'+(index+1))).trim();
    return {question_id:stableId,id:stableId,qid:stableId,order:index+1,position:index+1,
      question:String(q.question||''),type:q.type==='mcq'?'mcq':'desc',
      options:q.type==='mcq'&&Array.isArray(q.options)?q.options.map(String):[],
      max_score:Number.isFinite(Number(q.max_score))?Number(q.max_score):0,required:q.required===true};
  });
  if(!questions.length)throw new Error('بانک سؤال خالی است؛ چیزی برای ارسال به n8n وجود ندارد.');
  return {event_type:'exam_save',action:'sync_questions',source:'academy-admin',sent_at:new Date().toISOString(),
    examId:examId,exam_id:examId,examTitle:String(bank.examTitle||bank.exam_title||''),exam_title:String(bank.examTitle||bank.exam_title||''),
    formId:String(bank.formId||bank.form_id||''),form_id:String(bank.formId||bank.form_id||''),durationMin:0,status:'published',
    bank_id:String(bank.bankId||''),bank_version:String(bank.revision||''),question_count:questions.length,
    preserve_correct_answer:true,sort_by:'order',questions:questions};
}
async function send(bank){
  const payload=makePayload(bank);
  const form=new URLSearchParams();form.set('payload',JSON.stringify(payload));
  const url=EXAM_SAVE_URL+'?source=academy-admin&ts='+Date.now();
  try{
    await fetch(url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},
      body:form.toString(),credentials:'omit',cache:'no-store',keepalive:true});
  }catch(fetchError){
    if(!navigator.sendBeacon)throw fetchError;
    const ok=navigator.sendBeacon(url,new Blob([form.toString()],{type:'application/x-www-form-urlencoded;charset=UTF-8'}));
    if(!ok)throw fetchError;
  }
  return payload;
}
function install(){
  const yes=document.getElementById('confirmYes');
  if(!yes||typeof yes.onclick!=='function'){setTimeout(install,100);return;}
  if(yes.dataset.examSaveSync==='6')return;
  yes.dataset.examSaveSync='6';
  const original=yes.onclick;
  const dialog=document.getElementById('confirmPublish');
  if(dialog&&!document.getElementById('exam-save-sync-note')){
    const note=document.createElement('p');note.id='exam-save-sync-note';note.className='tip';
    note.textContent='همگام‌سازی سؤال‌ها فعال است (v6). قبل از انتشار، سؤال‌ها با POST مستقیم به exam-save فرستاده می‌شوند.';
    const input=dialog.querySelector('#commitNote');if(input)dialog.insertBefore(note,input);else dialog.append(note);
  }
  if(dialog&&!document.getElementById('exam-save-test')){
    const actions=dialog.querySelector('.dialog-actions');
    if(actions){
      const test=document.createElement('button');test.id='exam-save-test';test.type='button';test.textContent='تست ارسال به n8n';
      actions.insertBefore(test,actions.firstChild);
      test.onclick=async()=>{test.disabled=true;const old=test.textContent;test.textContent='در حال ارسال تست…';
        try{const p=await send(getBank());msg('POST تست برای '+p.questions.length+' سؤال به exam-save ارسال شد. حالا Executions را بررسی کن.','success');}
        catch(e){msg('تست n8n ناموفق بود: '+String(e.message||e),'error');}
        finally{test.disabled=false;test.textContent=old;}
      };
    }
  }
  yes.onclick=async function(event){
    if(yes.dataset.syncing==='1')return;
    yes.dataset.syncing='1';const old=yes.textContent;yes.disabled=true;yes.textContent='در حال ارسال به n8n…';
    try{
      const bank=getBank();
      const p=await send(bank);
      msg('POST برای '+p.questions.length+' سؤال به exam-save ارسال شد؛ انتشار فرم ادامه پیدا می‌کند.','success');
      if(bank){bank.mode='remote';bank.submitApproved=false;}
      yes.disabled=false;yes.textContent=old;yes.dataset.syncing='0';
      return original.call(this,event);
    }catch(e){
      yes.disabled=false;yes.textContent=old;yes.dataset.syncing='0';
      msg('انتشار متوقف شد؛ ارسال به n8n انجام نشد: '+String(e.message||e),'error');
    }
  };
}
install();
})();`;
  const extensions='<scr'+'ipt src="timing-admin.js?v=3">'+closeScript+'<scr'+'ipt>'+syncCode+closeScript;
  html=html.replace('<body>','<body>'+timingState);
  html=html.replace('</body>',extensions+'</body>');
  document.open();document.write(html);document.close();
})().catch(e=>{document.body.innerHTML='<div class="loading"><div><h2>پنل مدیریت بارگذاری نشد</h2><p>'+String(e.message||e)+'</p></div></div>';});
</script>
</body>
</html>
